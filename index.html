<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Nova - Free Study Material & PDF Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
        <h1 class="text-2xl font-black text-indigo-500 tracking-wider">EDU <span class="text-white">NOVA</span></h1>
        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">
            100% FREE
        </span>
    </nav>

    <!-- Hero Section -->
    <section class="text-center py-8 px-4 max-w-4xl mx-auto">
        <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold bg-indigo-500/10 px-3 py-1.5 rounded-full border border-indigo-500/20">
            Free Education Portal
        </span>
        <h2 class="text-3xl md:text-5xl font-extrabold mt-4 leading-tight">
            Class 9th to 12th <br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500">Free Handwritten Notes & PDFs</span>
        </h2>
    </section>

    <!-- Search & Filters Container -->
    <section class="max-w-6xl mx-auto px-6 space-y-6">
        
        <!-- Search Bar -->
        <div class="relative max-w-xl mx-auto">
            <input type="text" id="searchInput" onkeyup="filterNotes()" placeholder="चैप्टर या सब्जेक्ट का नाम सर्च करें... (e.g. Light, Physics)" 
                class="w-full bg-slate-900 border border-slate-800 focus:border-indigo-500 text-white px-5 py-3.5 rounded-2xl outline-none transition text-sm">
        </div>

        <!-- Class Filter Buttons -->
        <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">क्लास से चुनें:</h3>
            <div class="flex flex-wrap gap-2">
                <button onclick="setClassFilter('all')" class="class-btn active-btn bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition">All Classes</button>
                <button onclick="setClassFilter('9th')" class="class-btn bg-slate-900 border border-slate-800 hover:border-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">Class 9th</button>
                <button onclick="setClassFilter('10th')" class="class-btn bg-slate-900 border border-slate-800 hover:border-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">Class 10th</button>
                <button onclick="setClassFilter('11th')" class="class-btn bg-slate-900 border border-slate-800 hover:border-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">Class 11th</button>
                <button onclick="setClassFilter('12th')" class="class-btn bg-slate-900 border border-slate-800 hover:border-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition">Class 12th</button>
            </div>
        </div>

    </section>

    <!-- Dynamic Notes Cards Section -->
    <section class="max-w-6xl mx-auto px-6 py-8">
        <div id="notesContainer" class="grid md:grid-cols-2 gap-4">
            <!-- JavaScript स्वचालित रूप से यहाँ कार्ड्स बनाएगा -->
        </div>

        <!-- No Notes Found Alert -->
        <div id="noResults" class="hidden text-center py-12 text-slate-500">
            <p class="text-lg font-semibold">कोई नोट नहीं मिला!</p>
            <p class="text-xs mt-1">कृपया कोई दूसरा शब्द या क्लास चुनकर देखें।</p>
        </div>
    </section>

    <!-- Dynamic Data & Filter Script -->
    <script>
        // =============================================================
        // 📌 नए नोट्स जोड़ने के लिए बस इस लिस्ट (Array) में बदलाव करें:
        // =============================================================
        const notesData = [
            {
                title: "Matter In Our Surroundings",
                class: "9th",
                subject: "Science",
                desc: "Complete Handwritten Notes + NCERT Q&A",
                link: "YOUR_GOOGLE_DRIVE_LINK_HERE"
            },
            {
                title: "Light: Reflection & Refraction",
                class: "10th",
                subject: "Physics",
                desc: "Board Special Notes + Ray Diagrams",
                link: "YOUR_GOOGLE_DRIVE_LINK_HERE"
            },
            {
                title: "Chemical Reactions & Equations",
                class: "10th",
                subject: "Chemistry",
                desc: "Important Reactions & Balanced Equations",
                link: "YOUR_GOOGLE_DRIVE_LINK_HERE"
            },
            {
                title: "Some Basic Concepts of Chemistry",
                class: "11th",
                subject: "Chemistry",
                desc: "Mole Concept & Short Formulas",
                link: "YOUR_GOOGLE_DRIVE_LINK_HERE"
            },
            {
                title: "Electrostatics Full Chapter",
                class: "12th",
                subject: "Physics",
                desc: "Complete Chapter Formulas & Solved Numericals",
                link: "YOUR_GOOGLE_DRIVE_LINK_HERE"
            }
        ];

        let selectedClass = 'all';

        // कार्ड्स जनरेट करने का फ़ंक्शन
        function renderNotes(data) {
            const container = document.getElementById('notesContainer');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(note => {
                const card = `
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between hover:border-indigo-500/50 transition">
                        <div>
                            <div class="flex gap-2 mb-2">
                                <span class="text-[10px] bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded font-bold">Class ${note.class}</span>
                                <span class="text-[10px] bg-purple-500/20 text-purple-400 px-2 py-0.5 rounded font-bold">${note.subject}</span>
                            </div>
                            <h4 class="font-bold text-white text-base">${note.title}</h4>
                            <p class="text-xs text-slate-400 mt-1">${note.desc}</p>
                        </div>
                        <a href="${note.link}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ml-4">
                            PDF डाउनलोड
                        </a>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // फ़िल्टर और सर्च फ़ंक्शन
        function filterNotes() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = notesData.filter(note => {
                const matchesClass = (selectedClass === 'all' || note.class === selectedClass);
                const matchesSearch = note.title.toLowerCase().includes(searchVal) || 
                                      note.subject.toLowerCase().includes(searchVal) ||
                                      note.desc.toLowerCase().includes(searchVal);
                return matchesClass && matchesSearch;
            });

            renderNotes(filtered);
        }

        function setClassFilter(className) {
            selectedClass = className;
            filterNotes();
        }

        // पहली बार पेज लोड होने पर कार्ड्स दिखाएं
        renderNotes(notesData);
    </script>

    <!-- Footer -->
    <footer class="border-t border-slate-800 text-center py-6 text-xs text-slate-500 mt-12">
        © 2026 Edu Nova | Free Quality Education For Everyone
    </footer>

</body>
</html>
